services:
  endpointlab:
    build:
      context: .
    env_file:
      - ./docker/wss.env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --use-system-ca
      NODE_EXTRA_CA_CERTS: /run/endpointlab-certs/wss.cert.pem
      PORT: 8080
      DB_PATH: /app/data/db.sqlite
    volumes:
      - endpointlab-data:/app/data
      - ./docker/certs/wss.cert.pem:/run/endpointlab-certs/wss.cert.pem:ro
    network_mode: host
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - endpointlab
    network_mode: host
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  endpointlab-data:
